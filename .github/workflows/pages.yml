name: Playtest preview (GitHub Pages)

# Builds this branch and publishes it to GitHub Pages so the grip change can be
# played from a URL. Every push refreshes the live preview. Requires a one-time
# repo setting: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches:
      - claude/current-state-report-a81tov
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live preview at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project Pages serve under /<repo>/, so the bundle needs that base or its
      # absolute asset URLs 404. tsc is a separate typecheck (noEmit); the build
      # only needs Vite to emit dist.
      - run: npx vite build --base=/moon-miner/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
