<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Moon Miner</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden; }
      #app3d { position: fixed; inset: 0; touch-action: none; }
      #hint3d {
        position: fixed; left: 0; right: 0; bottom: 10px; z-index: 5; text-align: center;
        font: 12px/1.4 ui-monospace, monospace; color: #6b7d92;
        text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      /* On-screen thumb stick: appears where you touch, knob follows the drag. */
      #stick { position: fixed; z-index: 6; width: 132px; height: 132px; margin: -66px 0 0 -66px;
        border-radius: 50%; border: 2px solid rgba(143,217,201,0.5); background: rgba(12,16,24,0.35);
        display: none; pointer-events: none; }
      #stick .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
        border-radius: 50%; background: rgba(143,217,201,0.85); }
      /* HUD */
      #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 7; display: flex; gap: 14px; flex-wrap: wrap;
        align-items: center; padding: 8px 12px; background: linear-gradient(#05070ccc, #05070c00);
        font: 13px/1.2 ui-monospace, monospace; color: #dfe8f2; pointer-events: none; }
      #hud .vital { min-width: 96px; }
      #hud .vital b { display: block; font-size: 11px; color: #8fa3ba; font-weight: 400; letter-spacing: 0.04em; }
      #hud .vital span { font-size: 18px; }
      #hud .bar { height: 4px; border-radius: 2px; background: #263041; margin-top: 3px; overflow: hidden; }
      #hud .bar i { display: block; height: 100%; background: #78f7df; width: 0%; }
      #hud .chip { margin-left: auto; padding: 4px 10px; border: 1px solid #2b3a4d; border-radius: 6px; color: #cfe0ee; }
      #line { position: fixed; left: 0; right: 0; bottom: 34px; z-index: 6; text-align: center;
        font: 12px/1.3 ui-monospace, monospace; color: #9fb3c8; text-shadow: 0 1px 2px #000; pointer-events: none; }
      #banner { position: fixed; inset: 0; z-index: 8; display: none; flex-direction: column; gap: 8px;
        align-items: center; justify-content: center; text-align: center; background: #05070c99;
        font: 15px/1.4 ui-monospace, monospace; color: #eaf2fb; }
      #banner h2 { margin: 0; font-size: 26px; letter-spacing: 0.06em; }
      #banner .cta { margin-top: 10px; padding: 10px 18px; border: 2px solid #77f2ca; border-radius: 10px; color: #ecfffa; }
      #banner.win h2 { color: #77f2ca; } #banner.lose h2 { color: #ff8491; }
      #launch { position: fixed; right: 14px; bottom: 22px; z-index: 7; padding: 12px 16px;
        border-radius: 12px; border: 1px solid #2f6b5c; background: rgba(18,56,47,0.8); color: #d7fff3;
        font: 14px/1.1 ui-monospace, monospace; text-align: center; }
      #launch:disabled { opacity: 0.4; }
      #launch small { display: block; font-size: 10px; color: #8fd9c9; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="app3d"></div>
    <div id="hud">
      <div class="vital"><b>NANOBOTS</b><span id="hud-nano">–</span><div class="bar"><i id="hud-nano-bar"></i></div></div>
      <div class="vital"><b>ORE</b><span id="hud-ore">–</span><div class="bar"><i id="hud-ore-bar"></i></div></div>
      <div class="vital"><b>SUN</b><span id="hud-sun">–</span><div class="bar"><i id="hud-sun-bar"></i></div></div>
      <div class="vital"><b>SHIFT</b><span id="hud-day" style="font-size:14px">–</span></div>
      <div class="chip" id="hud-mode">–</div>
    </div>
    <div id="line"></div>
    <div id="banner"><h2 id="banner-title"></h2><div id="banner-body"></div><div class="cta">Tap to run again</div></div>
    <div id="stick"><div class="knob"></div></div>
    <button id="launch">Launch<small>drone · space</small></button>
    <div id="hint3d">drag anywhere to drive (or W/A/S/D)</div>
    <script type="module" src="/src/three/bootstrap.ts"></script>
  </body>
</html>
